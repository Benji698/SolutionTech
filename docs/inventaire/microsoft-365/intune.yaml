domaine: microsoft-365
sous_domaine: intune
recense_le: 2026-10-29
problemes:
  # --- Inscription Windows (enrollment) ---
  - id: intune-inscription-windows-0x80180014-non-supporte
    titre: "Inscription Windows refusée : « Your organization does not support this version of Windows » (0x80180014)"
    symptome: "L'ajout du compte professionnel ou l'Autopilot échoue ; l'inscription MDM Windows est bloquée par les restrictions de plateforme ou l'appareil a déjà été pré-provisionné."
    erreurs: ["There was a problem. Your organization does not support this version of Windows. (0x80180014)", "80180014"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/troubleshoot-windows-enrollment-errors
      - https://www.prajwaldesai.com/intune-enrollment-error-80180014/
      - https://cloudinfra.net/fix-intune-enrollment-error-code-80180014
    etat: a-rediger
  - id: intune-inscription-windows-0x80180018-licence
    titre: "Inscription Windows échoue : erreur de licence 0x80180018 (MENROLL_E_USERLICENSE)"
    symptome: "L'utilisateur ne peut pas inscrire le poste ; aucune licence Intune n'est attribuée ou l'utilisateur est hors de la portée utilisateur MDM."
    erreurs: ["0x80180018", "MENROLL_E_USERLICENSE"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/answers/questions/2125004/microsoft-entra-id-error-0x80180018
      - https://techcommunity.microsoft.com/discussions/microsoft-intune/error-code-80180018/4056745/replies/4056816
      - https://learn.microsoft.com/en-us/windows/win32/mdmreg/mdm-registration-constants
    etat: a-rediger
  - id: intune-inscription-auto-gpo-0x8018002b
    titre: "Inscription automatique par GPO échouée : « Auto MDM Enroll: Failed (0x8018002b) » (événement 76)"
    symptome: "Le poste joint à Entra ID hybride ne s'inscrit pas dans Intune ; la tâche planifiée EnterpriseMgmt échoue. UPN en .local non routable ou portée utilisateur MDM sur « Aucun »."
    erreurs: ["Auto MDM Enroll: Failed (Unknown Win32 Error code: 0x8018002b)", "Event ID 76"]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/troubleshoot-windows-enrollment-errors
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/troubleshoot-windows-auto-enrollment
      - https://www.anoopcnair.com/intune-enrollment-error-unknown-win32-error
    etat: a-rediger
  - id: intune-inscription-auto-gpo-80180002b-ancien-tenant
    titre: "Inscription automatique par GPO échouée avec 0x80180002b (poste lié à un ancien tenant)"
    symptome: "L'inscription GPO échoue (événement 76) car l'appareil a été joint à un autre tenant puis ne l'a pas quitté proprement."
    erreurs: ["Auto MDM Enroll: Failed (Unknown Win32 Error code: 0x80180002b)"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/windows10-enroll-error-80180002b
    etat: a-rediger
  - id: intune-inscription-windows-0x80180003-non-autorise
    titre: "« This user is not authorized to enroll » (80180003 / 0x801c0003)"
    symptome: "L'inscription ou la jonction Entra échoue : limite d'appareils atteinte, restriction de type d'appareil, édition Famille ou utilisateur non autorisé à joindre des appareils."
    erreurs: ["Something went wrong. This user is not authorized to enroll. You can try to do this again or contact your system administrator with error code 80180003.", "This user is not authorized to enroll. (0x801c0003)"]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/windows-user-cannot-enroll
      - https://www.niallbrady.com/2018/01/16/troubleshooting-something-went-wrong-error-801c0003-during-enrollment-via-windows-autopilot-and-microsoft-intune/
      - https://www.anoopcnair.com/intune-something-went-wrong-error-801c0003
    etat: a-rediger
  - id: intune-inscription-windows-8018000a-deja-inscrit
    titre: "« The device is already enrolled » (8018000a) : un autre utilisateur a déjà inscrit le poste"
    symptome: "L'ajout du compte professionnel échoue car un autre compte professionnel est déjà connecté sur l'appareil ou une inscription d'un autre MDM subsiste."
    erreurs: ["Something went wrong. The device is already enrolled. You can contact your system administrator with the error code 8018000a."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/troubleshoot-windows-enrollment-errors
      - https://call4cloud.nl/intune-device-enrollment-errors-mdm-enrollment/
    etat: a-rediger
  - id: intune-gpupdate-windows-failed-to-apply-mdm-policy
    titre: "gpupdate affiche « Windows failed to apply the MDM Policy settings » sur un poste déjà inscrit"
    symptome: "Avertissement à chaque gpupdate /force sur un poste hybride inscrit ; la GPO d'inscription automatique retente l'inscription (0x8018000a). Comportement attendu, sans impact."
    erreurs: ["Windows failed to apply the MDM Policy settings", "Extension MDM Policy returned 0x8018000a"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/windows-failed-to-apply-mdm-policy
    etat: a-rediger
  - id: intune-inscription-windows-0x8007064c-deja-inscrit-clone
    titre: "« The machine is already enrolled » (hr 0x8007064c) : image clonée ou ancien certificat présent"
    symptome: "L'inscription échoue sur un poste cloné ou précédemment inscrit ; un certificat Intune (Sc_Online_Issuing) et la clé OnlineManagement subsistent."
    erreurs: ["The machine is already enrolled", "hr 0x8007064c"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/mem/intune/device-enrollment/troubleshoot-windows-enrollment-errors
    etat: a-rediger
