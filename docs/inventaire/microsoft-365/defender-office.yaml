  - id: defender-quarantaine-mac-certificat-client
    titre: "Mac : certificat client demandé lors de la libération d'un message de quarantaine"
    symptome: "Sur Mac, la libération depuis la notification ouvre une demande de certificat client pour le site de quarantaine."
