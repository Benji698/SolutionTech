    symptome: Un partenaire ne peut plus écrire à des destinataires Microsoft 365 car l'IP de son serveur est sur la liste de blocage Microsoft.
    erreurs:
      - 550 5.7.606 Access denied, banned sending IP
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/defender-office-365/external-senders-use-the-delist-portal-to-unblock-yourself
