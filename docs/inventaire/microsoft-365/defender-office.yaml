      - Suspicious email sending patterns detected
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/answers/questions/1341681/defender-portal-restricted-entities-how-to-notify
      - https://learn.microsoft.com/en-us/training/modules/examine-microsoft-defender-office-365/5-configure-outbound-spam-filtering-policies
