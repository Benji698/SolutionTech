    titre: 550 5.7.750 Client blocked from sending from unregistered domains
    symptome: Les messages envoyés avec une adresse d'un domaine non ajouté/vérifié dans le locataire sont refusés.
    erreurs:
      - 550 5.7.750 Client blocked from sending from unregistered domains
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-codes-550-5-7-703-550-5-7-705-550-5-7-708-550-5-7-750
