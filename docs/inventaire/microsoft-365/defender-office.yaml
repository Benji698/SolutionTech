domaine: microsoft-365
sous_domaine: defender-office
recense_le: 2026-10-29
problemes:
  - id: defender-quarantaine-message-libere-non-recu
    titre: Message libéré de la quarantaine mais jamais arrivé dans la boîte
    symptome: La libération indique un succès, mais le destinataire ne voit toujours pas le message dans sa boîte de réception.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-CA/defender-office-365/quarantine-faq
      - https://learn.microsoft.com/en-us/defender-office-365/quarantine-admin-manage-messages-files
    etat: a-rediger
  - id: defender-quarantaine-message-remis-en-quarantaine
    titre: Message libéré puis remis en quarantaine par une règle de flux de messagerie
    symptome: Après libération, le même message retourne aussitôt en quarantaine car une règle de transport (mail flow rule) le capture à nouveau.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-CA/defender-office-365/quarantine-faq
    etat: a-rediger
  - id: defender-quarantaine-utilisateur-ne-peut-pas-liberer
    titre: L'utilisateur ne peut pas libérer son message (seulement « Demander la libération »)
    symptome: Le message en quarantaine (hameçonnage à haut niveau de confiance ou programme malveillant) est visible mais grisé ; seul le bouton Demander la libération (Request release) est proposé.
    erreurs:
      - Request release
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/defender-office-365/quarantine-quarantine-notifications
      - https://learn.microsoft.com/en-CA/defender-office-365/quarantine-faq
      - https://logios.mit.edu/confluence/display/istcontrib/Identifying+Quarantine+Messages+from+Microsoft
    etat: a-rediger
  - id: defender-quarantaine-demande-liberation-non-traitee
    titre: Demandes de libération de quarantaine non reçues ou non traitées par les administrateurs
    symptome: Les utilisateurs cliquent sur Demander la libération, mais aucun administrateur n'est averti et le message reste bloqué.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/defender-office-365/quarantine-quarantine-notifications
      - https://ccit.clemson.edu/?p=22390
    etat: a-rediger
  - id: defender-quarantaine-notifications-non-recues
    titre: Notifications de quarantaine (courrier indésirable) non reçues par les utilisateurs
    symptome: Les utilisateurs ne reçoivent plus le résumé des messages mis en quarantaine envoyé par quarantine@messaging.microsoft.com.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/answers/questions/1326669/quarantine-email-notifications-have-stopped-as-of
      - https://learn.microsoft.com/en-us/defender-office-365/quarantine-quarantine-notifications
    etat: a-rediger
  - id: defender-quarantaine-notifications-inattendues-strategie-predefinie
    titre: Les utilisateurs reçoivent soudain des notifications de quarantaine (stratégies prédéfinies)
    symptome: Après activation d'une stratégie de sécurité prédéfinie (Standard/Strict), des notifications arrivent alors que les stratégies personnalisées ne les prévoient pas.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://techcommunity.microsoft.com/discussions/microsoftdefenderforoffice365/preset-policies-have-suddenly-started-notifying-users-of-quarantined-messages/3773775
    etat: a-rediger
  - id: defender-quarantaine-message-introuvable
    titre: Message introuvable dans la quarantaine (recherche par ID, durée de conservation dépassée)
    symptome: "L'administrateur ne retrouve pas le message bloqué : ID de message saisi sans chevrons, filtre de dates, ou message supprimé après la durée de conservation de la quarantaine."
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/defender-office-365/quarantine-admin-manage-messages-files
      - https://learn.microsoft.com/en-CA/defender-office-365/quarantine-faq
    etat: a-rediger
  - id: defender-quarantaine-droits-insuffisants
    titre: "Impossible de libérer ou refuser un message en quarantaine : boutons grisés (rôle insuffisant)"
    symptome: Un technicien voit la quarantaine en lecture seule (Lecteur de sécurité / Security Reader) ; les actions Libérer ou Refuser sont grisées.
    erreurs: []
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/defender-office-365/quarantine-admin-manage-messages-files
      - https://techcommunity.microsoft.com/discussions/microsoftdefenderatp/deny-option-in-quarantined-emails-grayed-out/4413993
      - https://techcommunity.microsoft.com/discussions/microsoftthreatprotection/defender-rbac---grant-at-least-priviliged-for-quarantine-handling-not-working/4044755
    etat: a-rediger
  - id: defender-quarantaine-mac-certificat-client
    titre: "Mac : certificat client demandé lors de la libération d'un message de quarantaine"
    symptome: Sur Mac, la libération depuis la notification ouvre une demande de certificat client pour le site de quarantaine.
    erreurs:
      - na01-quarantine.dataservice.protection.outlook.com requires a client certificate
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/administration/release-messages-prompted-client-certificate
    etat: a-rediger
  - id: defender-quarantaine-liberation-liste-distribution
    titre: Libérer un message mis en quarantaine adressé à une liste de distribution
    symptome: Un message envoyé à un groupe de distribution est en quarantaine ; la libération ne le délivre pas à tous les membres.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://techcommunity.microsoft.com/t5/exchange/how-to-release-a-qurantined-email-sent-to-a-distribution-list/td-p/3938986
    etat: a-rediger
  - id: defender-quarantaine-liberation-echec-filtrage-tiers
    titre: Libération impossible même avec Release-QuarantineMessage -Force (filtrage tiers devant M365)
    symptome: La libération échoue ou le message est rebloqué lorsque une passerelle tierce filtre aussi le courrier.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-CA/defender-office-365/quarantine-faq
    etat: a-rediger
  - id: defender-faux-positif-courrier-indesirable
    titre: Message légitime classé en courrier indésirable (Junk)
    symptome: Des messages de partenaires ou clients arrivent dans le dossier Courrier indésirable (Junk Email) au lieu de la boîte de réception.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-gb/defender-office-365/step-by-step-guides/how-to-handle-false-positives-in-microsoft-defender-for-office-365
      - https://learn.microsoft.com/de-de/archive/blogs/exovoice/basic-spam-troubleshooting-in-office-365
    etat: a-rediger
  - id: defender-faux-positif-quarantaine-hameconnage
    titre: Message légitime mis en quarantaine comme hameçonnage (phishing / high confidence phish)
    symptome: Un message attendu n'arrive pas ; il est en quarantaine avec le motif Hameçonnage ou Hameçonnage à haut niveau de confiance.
    erreurs:
      - High confidence phish
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-gb/defender-office-365/step-by-step-guides/how-to-handle-false-positives-in-microsoft-defender-for-office-365
      - https://techcommunity.microsoft.com/discussions/microsoftdefenderforoffice365/help-me-understand-why-this-email-was-quarantined/4427946
    etat: a-rediger
  - id: defender-faux-positif-mail-interne-hameconnage
    titre: Mail interne (entre collègues) mis en quarantaine comme hameçonnage à haut niveau de confiance
    symptome: Un message envoyé d'un utilisateur à un autre du même locataire est bloqué comme high confidence phish par la stratégie anti-spam par défaut.
    erreurs:
      - High confidence phish
    priorite: rare
    format: complete
    sources:
      - https://techcommunity.microsoft.com/discussions/microsoftdefenderforoffice365/internal-user-email-quarantined-and-reason-high-confidence-phish/4171376
    etat: a-rediger
  - id: defender-faux-negatif-spam-phishing-recus
    titre: Spam ou hameçonnage qui passent quand même dans les boîtes (faux négatifs)
    symptome: Les utilisateurs reçoivent régulièrement du spam ou des mails d'hameçonnage en boîte de réception malgré EOP / Defender.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/de-de/archive/blogs/exovoice/basic-spam-troubleshooting-in-office-365
      - https://microsoft.github.io/zerotrustassessment/de/docs/workshop-guidance/securityoperations/SVA_MDO021
    etat: a-rediger
  - id: defender-scan-to-mail-classe-spam
    titre: Mails de numérisation (scan-to-mail) des copieurs classés en spam ou en quarantaine
    symptome: Les scans envoyés par le copieur multifonction arrivent en indésirable ou en quarantaine (usurpation du domaine interne, IP non autorisée).
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://techcommunity.microsoft.com/discussions/microsoft-365/anti-spam-protection-policy-scan2mail-false-positives/3772912
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/fix-issues-with-printers-scanners-and-lob-applications-that-send-email-using-off
    etat: a-rediger
  - id: defender-incident-service-faux-positifs-massifs
    titre: Nombreux messages légitimes bloqués d'un coup (incident côté Microsoft)
    symptome: Du jour au lendemain, beaucoup de mails légitimes partent en indésirable ou en quarantaine dans plusieurs locataires ; un incident est publié dans l'état du service.
    erreurs:
      - EX682041
    priorite: rare
    format: express
    sources:
      - https://borncity.com/win/2023/10/18/exchange-online-microsoft-deaktiviert-spam-regel-die-alles-als-junk-mail-betrachtet-hat-ex682041/
      - https://www.pulse.bot/cybersecurity/news/microsoft-exchange-online-flags-legitimate-emails-as-phishing-8f2e1d43-b75a-40c2-8c7a-4d2b92e7ecb2/
    etat: a-rediger
  - id: defender-soumission-microsoft-toujours-bloque
    titre: Soumission à Microsoft effectuée mais le message ou l'expéditeur reste bloqué
    symptome: Après une soumission administrateur (Submissions) comme faux positif, les messages suivants du même expéditeur sont toujours filtrés.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/training/modules/examine-microsoft-defender-office-365/7-submit-messages-urls-attachments-microsoft-analysis
      - https://microsoft.github.io/zerotrustassessment/de/docs/workshop-guidance/securityoperations/SVA_MDO021
    etat: a-rediger
  - id: defender-courrier-en-nombre-bcl-newsletters
    titre: Newsletters et mails marketing envoyés en indésirable ou en quarantaine (BCL, courrier en nombre)
    symptome: Des lettres d'information attendues sont classées comme courrier en nombre (bulk) ; l'en-tête montre un BCL élevé.
    erreurs:
      - BCL:7
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-US/defender-office-365/anti-spam-bulk-senders-insight
      - https://o365reports.com/move-bulk-emails-to-promotions-folder-using-bulkmovesenabled/
    etat: a-rediger
  - id: defender-regle-scl-moins-un-ignoree
    titre: "Règle de transport « SCL -1 » (contourner le filtrage) sans effet : message quand même en quarantaine"
    symptome: Une règle de flux qui fixe le SCL à -1 n'empêche pas la quarantaine d'un message détecté comme hameçonnage à haut niveau de confiance ou programme malveillant.
    erreurs:
      - SCL:-1
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/Exchange/security-and-compliance/mail-flow-rules/use-rules-to-set-scl
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/antispam-and-protection/cautions-against-bypassing-spam-filters
    etat: a-rediger
  - id: defender-impersonation-faux-positif
    titre: Faux positif d'emprunt d'identité (impersonation) d'un utilisateur ou d'un domaine protégé
    symptome: Des messages d'un partenaire dont le nom ou le domaine ressemble à un utilisateur ou domaine protégé sont mis en quarantaine pour usurpation d'identité.
    erreurs:
      - Impersonation user
      - Impersonation domain
    priorite: frequent
    format: complete
    sources:
      - https://blueprint.asd.gov.au/design/shared-services/defender/anti-phishing/
      - https://techcommunity.microsoft.com/t5/microsoft-defender-xdr/managing-false-negative-and-false-positive-emails-concerning/m-p/2896434
    etat: a-rediger
  - id: defender-usurpation-compauth-fail-expediteur-legitime
    titre: Expéditeur légitime bloqué pour usurpation (compauth=fail)
    symptome: Les messages d'un fournisseur (ou d'un service d'envoi tiers) sont mis en quarantaine ; l'en-tête Authentication-Results montre compauth=fail reason=000 ou 001.
    erreurs:
      - compauth=fail reason=000
      - compauth=fail reason=001
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/defender-office-365/email-auth-sec-ops-guide
      - https://learn.microsoft.com/defender-office-365/tenant-allow-block-list-email-spoof-configure
    etat: a-rediger
  - id: defender-ndr-550-5-7-509-dmarc-reject
    titre: "Rejet DMARC : 550 5.7.509 Access denied, sending domain does not pass DMARC verification"
    symptome: L'expéditeur reçoit un rapport de non-remise car son domaine échoue DMARC alors que sa stratégie est p=reject.
    erreurs:
      - 550 5.7.509 Access denied, sending domain [domaine] does not pass DMARC verification and has a DMARC policy of reject
    priorite: frequent
    format: express
    sources:
      - https://techcommunity.microsoft.com/blog/exchange/announcing-new-dmarc-policy-handling-defaults-for-enhanced-email-security/3878883
      - https://techcommunity.microsoft.com/discussions/microsoftdefenderforoffice365/access-denied-sending-domain-does-not-pass-dmarc-verification-and-has-a-dmarc-po/4212076
    etat: a-rediger
  - id: defender-ndr-5-7-23-spf
    titre: "Rejet SPF : 550 5.7.23 The message was rejected because of Sender Policy Framework violation"
    symptome: Les messages d'un expéditeur sont rejetés à cause d'un échec SPF (enregistrement SPF incomplet ou serveur non autorisé).
    erreurs:
      - 550 5.7.23 The message was rejected because of Sender Policy Framework violation
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-code-5-7-23-in-exchange-online
    etat: a-rediger
  - id: defender-bandeau-rouge-fraud-detection
    titre: Bandeau rouge « This sender failed our fraud detection checks » sur un mail légitime
    symptome: Outlook affiche un avertissement rouge de suspicion de fraude sur des messages de listes de diffusion ou de services qui envoient au nom d'un domaine.
    erreurs:
      - This sender failed our fraud detection checks and may not be who they appear to be.
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-gb/archive/blogs/tzink/troubleshooting-the-red-suspicious-safety-tip-for-fraud-detection-checks
      - https://it.cornell.edu/microsoft-outlook/fraud-detection-warnings-email-messages
    etat: a-rediger
  - id: defender-astuce-premier-contact
    titre: Bandeau « You don't often get email from… » (conseil de premier contact) gênant ou persistant
    symptome: Un avertissement apparaît en haut des messages provenant d'expéditeurs inhabituels ; les utilisateurs demandent à le supprimer.
    erreurs:
      - You don't often get email from [adresse]. Learn why this is important
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-gb/answers/questions/1454974/how-to-disable-you-dont-often-get-email-from-notic
      - https://information-services.ed.ac.uk/computing/first-contact-safety-tips
    etat: a-rediger
  - id: defender-efc-passerelle-tierce-faux-positifs
    titre: "Passerelle tierce (Mimecast, Proofpoint…) devant M365 : faux positifs d'usurpation, filtrage amélioré mal configuré"
    symptome: "Avec un MX qui pointe vers une passerelle tierce, Microsoft voit l'IP de la passerelle : échecs SPF/DMARC et usurpations détectées à tort ; le filtrage amélioré des connecteurs (skip listing) ne s'applique pas."
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/exchange/mail-flow-best-practices/use-connectors-to-configure-mail-flow/enhanced-filtering-for-connectors
      - https://techcommunity.microsoft.com/discussions/microsoftdefenderforoffice365/enhanced-filtering-for-connectors-not-working/2808783
      - https://c7solutions.com/2020/09/enable-eop-enhanced-filtering-for-mimecast-users
    etat: a-rediger
  - id: defender-liste-autorisation-blocage-sans-effet
    titre: Entrée « Autoriser » de la liste d'autorisation/blocage du locataire sans effet
    symptome: Malgré une entrée d'autorisation pour un domaine ou une adresse, les messages restent bloqués (mauvais onglet, entrée de blocage prioritaire, usurpation).
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/defender-office-365/tenant-allow-block-list-about
      - https://techcommunity.microsoft.com/discussions/microsoftdefenderforoffice365/tenant-allow-block-lists-not-working-as-expected/4275265
    etat: a-rediger
  - id: defender-ndr-550-5-7-703-destinataire-bloque-liste
    titre: "550 5.7.703 : envoi bloqué vers un destinataire présent dans la liste de blocage du locataire"
    symptome: Un utilisateur interne reçoit une non-remise en écrivant à une adresse ou un domaine bloqué dans la liste d'autorisation/blocage du locataire.
    erreurs:
      - 550 5.7.703
    priorite: rare
    format: express
    sources:
