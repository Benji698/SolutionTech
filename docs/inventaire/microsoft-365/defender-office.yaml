  - id: defender-quarantaine-message-libere-non-recu
    titre: "Message libéré de la quarantaine mais jamais arrivé dans la boîte"
    symptome: "La libération indique un succès, mais le destinataire ne voit toujours pas le message dans sa boîte de réception."
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-CA/defender-office-365/quarantine-faq
      - https://learn.microsoft.com/en-us/defender-office-365/quarantine-admin-manage-messages-files
    etat: a-rediger

  - id: defender-quarantaine-message-remis-en-quarantaine
    titre: "Message libéré puis remis en quarantaine par une règle de flux de messagerie"
    symptome: "Après libération, le même message retourne aussitôt en quarantaine car une règle de transport (mail flow rule) le capture à nouveau."
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-CA/defender-office-365/quarantine-faq
    etat: a-rediger

  - id: defender-quarantaine-utilisateur-ne-peut-pas-liberer
