    etat: a-rediger
  - id: defender-utilisateur-restreint-550-5-1-8
    titre: "Utilisateur bloqué pour envoi de spam : 550 5.1.8 Access denied, bad outbound sender"
    symptome: Un utilisateur ne peut plus envoyer aucun mail (il en reçoit toujours) ; il figure dans la page Entités restreintes (Restricted entities). Souvent signe de compte compromis.
    erreurs:
      - 550 5.1.8 Access denied, bad outbound sender
    priorite: critique
    format: complete
    sources:
