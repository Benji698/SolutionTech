    titre: 550 5.7.511 Access denied, banned sender (portail de retrait inutilisable)
    symptome: L'expéditeur est banni ; le portail sender.office.com ne permet pas de lever ce blocage.
    erreurs:
      - 550 5.7.511 Access denied, banned sender
    priorite: rare
    format: express
    sources:
