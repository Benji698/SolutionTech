  - id: defender-alerte-limite-envoi-depassee
    titre: Alerte « Email sending limit exceeded » / « User restricted from sending email »
    symptome: Les administrateurs reçoivent une alerte Defender indiquant qu'un utilisateur a dépassé les limites d'envoi ou a été restreint.
    erreurs:
      - Email sending limit exceeded
