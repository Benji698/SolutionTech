  - id: defender-quarantaine-notifications-inattendues-strategie-predefinie
    titre: "Les utilisateurs reçoivent soudain des notifications de quarantaine (stratégies prédéfinies)"
    symptome: "Après activation d'une stratégie de sécurité prédéfinie (Standard/Strict), des notifications arrivent alors que les stratégies personnalisées ne les prévoient pas."
