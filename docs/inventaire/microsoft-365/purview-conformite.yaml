  - id: purview-avertissement-boite-pleine-quota-non-atteint
    titre: Avertissement « boîte pleine » alors que le quota n'est pas atteint (impossible de supprimer ou d'accepter une réunion)
    symptome: L'utilisateur reçoit l'alerte de boîte pleine et ne peut ni supprimer de message ni répondre aux invitations, alors que la taille de la boîte est normale.
