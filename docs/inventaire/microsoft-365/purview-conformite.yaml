  - id: purview-elements-recuperables-pleins-conservation
    titre: Dossier Éléments récupérables plein sur une boîte en conservation pour litige ou rétention
    symptome: La boîte sous conservation ne peut plus supprimer d'éléments ; le dossier Recoverable Items atteint son quota (100 Go) et n'est pas déplacé vers l'archive.
