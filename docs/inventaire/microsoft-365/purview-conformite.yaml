    priorite: critique
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/antispam-and-protection/recoverable-items-folder-full
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/archive-mailboxes/mailbox-full-warning-though-not-reached-quota
