domaine: microsoft-365
sous_domaine: purview-conformite
recense_le: 2026-10-29
problemes:
  - id: purview-retention-strategie-en-erreur
    titre: Stratégie de rétention ou d'étiquettes en erreur (état « Erreur » / PolicyNotifyError)
    symptome: Dans le portail Purview, la stratégie de rétention affiche un état d'erreur (Settings not found, Something went wrong) et ne s'applique pas à tous les emplacements.
    erreurs:
      - Settings not found
      - Something went wrong
      - PolicyNotifyError
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/identify-errors-in-retention-and-retention-label-policies
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/resolve-errors-in-retention-and-retention-label-policies
    etat: a-rediger
  - id: purview-retention-strategie-traitement-en-cours
    titre: Stratégie de rétention bloquée sur « We're still processing your policy »
    symptome: La distribution de la stratégie ne se termine pas ; le message de traitement en cours reste affiché pendant des heures ou des jours.
    erreurs:
      - We're still processing your policy
      - We can't process your policy
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/resolve-errors-in-retention-and-retention-label-policies
    etat: a-rediger
  - id: purview-retention-strategie-pendingdeletion
    titre: Stratégie de rétention bloquée en PendingDeletion (suppression impossible)
    symptome: Une stratégie supprimée reste listée avec l'état PendingDeletion et ne disparaît jamais.
    erreurs:
      - Your policy is stuck in PendingDeletion
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/resolve-errors-in-retention-and-retention-label-policies
    etat: a-rediger
  - id: purview-retention-emplacement-ambigu
    titre: "Stratégie de rétention : « The location is ambiguous » (MultipleInactiveRecipientsError)"
    symptome: La stratégie est en erreur car un emplacement correspond à plusieurs destinataires (souvent une boîte active et une boîte inactive).
    erreurs:
      - The location is ambiguous
      - MultipleInactiveRecipientsError
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/resolve-errors-in-retention-and-retention-label-policies
    etat: a-rediger
  - id: purview-retention-site-quota-ou-verrouille
    titre: Stratégie de rétention en erreur sur un site SharePoint plein ou verrouillé (SiteOutOfQuota, SiteInReadOnlyOrNotAccessible)
    symptome: "La stratégie ne s'applique pas à certains sites : quota du site atteint ou site en lecture seule / verrouillé."
    erreurs:
      - The location is out of storage
      - SiteOutOfQuota
      - The site is locked
      - SiteInReadOnlyOrNotAccessible
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/resolve-errors-in-retention-and-retention-label-policies
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/ediscovery/resolve-ediscovery-hold-issues
    etat: a-rediger
  - id: purview-retention-emplacement-introuvable
    titre: "Stratégie de rétention : « We couldn't find this location »"
    symptome: Un emplacement (boîte, site, groupe) inclus dans la stratégie a été supprimé ou renommé ; la stratégie passe en erreur.
    erreurs:
      - We couldn't find this location
      - We ran into a problem
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/resolve-errors-in-retention-and-retention-label-policies
    etat: a-rediger
  - id: purview-retention-impossible-appliquer-conservation
    titre: "Stratégie de rétention : « You can't apply a hold here »"
    symptome: La stratégie ou la conservation échoue sur un emplacement non pris en charge (type de destinataire non autorisé).
    erreurs:
      - You can't apply a hold here
      - RecipientTypeNotAllowed
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/resolve-errors-in-retention-and-retention-label-policies
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/ediscovery/resolve-ediscovery-hold-issues
    etat: a-rediger
  - id: purview-etiquette-retention-auto-non-appliquee
    titre: Étiquette de rétention appliquée automatiquement qui ne s'applique pas aux messages
    symptome: Une stratégie d'application automatique d'étiquette de rétention est publiée, mais les éléments de la boîte aux lettres ne reçoivent pas l'étiquette.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/auto-apply-retention-label-not-apply-messages
    etat: a-rediger
  - id: purview-retention-messages-teams-supprimes
    titre: Messages Teams ou Viva Engage supprimés de façon inattendue par une stratégie de rétention
    symptome: Des conversations Teams disparaissent pour les utilisateurs alors que personne ne les a supprimées.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoftteams/teams-im-presence/messages-unexpectedly-deleted-retention-policy
    etat: a-rediger
  - id: purview-retention-pieces-jointes-cloud-non-conservees
    titre: Pièces jointes cloud (liens OneDrive/SharePoint) non conservées par la rétention
    symptome: Les fichiers partagés par lien dans Outlook ou Teams ne sont pas conservés comme attendu par la stratégie de rétention des pièces jointes cloud.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/cannot-retain-cloud-attachments
    etat: a-rediger
  - id: purview-retention-suppression-site-bloquee
    titre: "Impossible de supprimer un site ou des fichiers SharePoint/OneDrive : bloqué par une stratégie de conformité"
    symptome: La suppression d'un site, d'une bibliothèque ou de versions de documents échoue à cause d'une stratégie de rétention ou d'une conservation (parfois invalide).
    erreurs:
      - A compliance policy is currently blocking this site deletion.
      - Versions of this item cannot be deleted because it is on hold or retention policy.
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/sharepoint/sites/compliance-policy-blocking-site-deletion
      - https://learn.microsoft.com/en-us/troubleshoot/sharepoint/administration/exclude-sites-from-retention-policy
    etat: a-rediger
  - id: purview-retention-ne-fonctionne-plus-apres-migration
    titre: Stratégie de rétention inactive après migration de la boîte aux lettres vers Exchange Online (hybride)
    symptome: Après le déplacement d'une boîte locale vers Exchange Online, la stratégie de rétention ne s'applique plus.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/holds/retention-policy-not-working-after-mailbox-moved
    etat: a-rediger
  - id: purview-disposition-erreur-401-rbac
    titre: "Révision de destruction impossible : « (401) RBAC check failed »"
    symptome: Dans Gestion des enregistrements (Records management), l'onglet Destruction (Disposition) renvoie une erreur 401.
    erreurs:
      - The remote server returned an error (401) RBAC check failed
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/cannot-manage-disposition-reviews
    etat: a-rediger
  - id: purview-mrm-messages-non-deplaces-archive
    titre: Messages non déplacés vers l'archive malgré la stratégie de rétention (MRM)
    symptome: La boîte d'archivage est activée mais les anciens messages restent dans la boîte principale ; l'assistant de dossiers gérés ne semble pas passer.
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/archive-mailboxes/message-not-moved-to-archive
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/troubleshoot-mrm-email-archive-deletion
    etat: a-rediger
  - id: purview-mrm-elements-non-supprimes
    titre: Éléments non supprimés par la balise de rétention MRM (RetentionHoldEnabled, ElcProcessingDisabled)
    symptome: Les messages dépassant la durée de rétention ne sont pas supprimés ; la boîte a une suspension de rétention ou le traitement ELC désactivé.
    erreurs:
      - RetentionHoldEnabled
      - ElcProcessingDisabled
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/troubleshoot-mrm-email-archive-deletion
    etat: a-rediger
  - id: purview-boite-quota-atteint-malgre-archive
    titre: Boîte aux lettres pleine alors que l'archive est activée
    symptome: "La boîte principale atteint son quota bien qu'une archive existe : la stratégie de déplacement vers l'archive ne s'applique pas ou trop lentement."
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/archive-mailboxes/mailbox-reaches-quota
    etat: a-rediger
  - id: purview-mrm-elements-reapparaissent-migration-imap
    titre: Éléments qui réapparaissent ou dupliqués dans l'archive pendant une migration IMAP
    symptome: Après activation d'une stratégie d'archivage MRM pendant une migration IMAP, des éléments reviennent dans la boîte et se dupliquent dans l'archive.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/archive-mailboxes/items-duplicated
    etat: a-rediger
  - id: purview-mrm-dossiers-geres-vides-disparaissent
    titre: Dossiers gérés (Managed Folders) vides supprimés automatiquement
    symptome: Des dossiers gérés vides disparaissent régulièrement de la boîte aux lettres Exchange Online.
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365/purview/retention/managed-folders-disappear
    etat: a-rediger
  - id: purview-mrm-balise-personnelle-regle-boite
    titre: Balise de rétention personnelle mal appliquée par une règle de boîte de réception
    symptome: Une règle Outlook qui déplace des messages ne leur applique pas la balise personnelle attendue.
