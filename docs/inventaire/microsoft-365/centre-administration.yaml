  - id: exchange-hybride-domaine-impossible-a-verifier
    titre: "Domaine impossible à ajouter et vérifier en environnement hybride (ApplicationUri de l'approbation de fédération)"
    symptome: "Le domaine est déjà utilisé comme identifiant de l'organisation dans l'approbation de fédération Exchange local."
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/exchange/troubleshoot/administration/cannot-add-and-verify-domain
    etat: a-rediger

  - id: m365-domaine-tout-le-courrier-bascule
    titre: "Après ajout du domaine, tout le courrier de l'entreprise arrive dans Microsoft 365 (MX modifié trop tôt)"
    symptome: "Les utilisateurs encore chez l'ancien hébergeur ne reçoivent plus leurs mails."
    erreurs: []
    priorite: critique
    format: express
    sources:
      - https://learn.microsoft.com/en-us/microsoft-365/admin/get-help-with-domains/find-and-fix-issues
    etat: a-rediger

  - id: m365-domaine-etat-enregistrements-dns-manquants
    titre: "Domaine en état « Enregistrements DNS manquants » ou services qui ne fonctionnent pas avec le domaine"
    symptome: "La colonne État signale des problèmes ; « Vérifier l'intégrité » liste les enregistrements MX, CNAME, TXT à corriger."
    erreurs: []
    priorite: frequent
