    symptome: "Les enregistrements A/CNAME du site ont été modifiés ou supprimés lors de la configuration."
    erreurs: []
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/microsoft-365/admin/get-help-with-domains/find-and-fix-issues
      - https://learn.microsoft.com/en-us/microsoft-365/admin/dns/update-dns-records-to-retain-current-hosting-provider
