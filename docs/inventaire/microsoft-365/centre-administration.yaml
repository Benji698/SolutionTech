domaine: microsoft-365
sous_domaine: centre-administration
recense_le: 2026-10-30
problemes:
  # --- PowerShell : Exchange Online ---
  - id: exchange-powershell-access-denied-connexion
    titre: "Exchange Online PowerShell : « Access is denied » à la connexion"
    symptome: "La connexion au module Exchange Online échoue (mauvais identifiants, compte sans accès Exchange, paramètres de sécurité par défaut)."
    erreurs: ["Access is denied"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/exchange/troubleshoot/administration/access-denied-connect-powershell
    etat: a-rediger

  - id: exchange-powershell-bad-request-remotepowershell
    titre: "Exchange Online PowerShell : « Bad Request » (RemotePowerShellEnabled à False)"
    symptome: "La session distante ne s'ouvre pas car l'accès PowerShell est désactivé pour le compte administrateur."
    erreurs: ["Connecting to remote server outlook.office365.com failed with the following error message: Bad Request"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/exchange/troubleshoot/administration/bad-request-error-when-connecting-to-exchange-online-powershell
    etat: a-rediger

  - id: exchange-powershell-connect-ippssession-echec
    titre: "Connexion impossible à Security & Compliance PowerShell (Connect-IPPSSession)"
    symptome: "Connect-IPPSSession échoue après redirection vers ps.compliance.protection.outlook.com (version 3.1.0 du module en cause)."
    erreurs: ["Your connection has been redirected to the following URI", "PSRemotingDataStructureException"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/exchange/troubleshoot/administration/cannot-connect-to-security-compliance-powershell
    etat: a-rediger

  - id: exchange-powershell-window-handle-wam
    titre: "Connect-ExchangeOnline : « A window handle must be configured » (authentification WAM)"
    symptome: "Depuis les versions 3.5/3.7 du module, la fenêtre de connexion ne s'ouvre pas dans ISE ou certains hôtes PowerShell."
    erreurs: ["A window handle must be configured"]
    priorite: frequent
    format: express
    sources:
      - https://techcommunity.microsoft.com/discussions/exchange_general/windows-handle-error-when-using-connect-exchange-onlinew-module-version-3-7-/4372328
      - https://learn.microsoft.com/en-ie/answers/questions/2127369/when-i-run-the-connect-exchangeonline-to-connect-i
    etat: a-rediger

  - id: exchange-eac-lent-transcription-powershell
    titre: "Centre d'administration Exchange très lent à afficher les destinataires (transcription PowerShell activée)"
    symptome: "La liste des boîtes met plusieurs minutes à s'afficher dans le CAE."
    erreurs: []
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/exchange/troubleshoot/administration/eac-slow-to-display-recipients-if-powershell-transcription-is-turned-on
    etat: a-rediger

  - id: m365-powershell-conflit-assemblies-modules
