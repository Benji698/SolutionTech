  - id: m365-domaine-hebergeur-dns-limites
    titre: "Hébergeur DNS qui ne gère pas certains enregistrements (SRV, CNAME, TXT long) requis par Microsoft 365"
    symptome: "Impossible de créer un enregistrement demandé chez certains registraires."
    erreurs: []
    priorite: rare
    format: express
    sources:
