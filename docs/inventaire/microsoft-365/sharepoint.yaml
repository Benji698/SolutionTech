problemes:
  # --- Autorisations et accès ---
  - id: sharepoint-acces-refuse
    titre: "« Vous avez besoin d'une autorisation » sur un site ou un fichier SharePoint"
    symptome: "Un utilisateur interne ou un invité n'accède pas à un site, une bibliothèque ou un fichier (mauvais compte, pas de droits, partage externe fermé, invité ayant accepté avec un autre compte)."
    erreurs: ["You need permission to access this item.", "Sorry, this site hasn't been shared with you.", "Access Denied"]
    priorite: frequent
    format: complete
    sources:
