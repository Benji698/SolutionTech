  - id: sharepoint-admin-global-sans-acces-site
    titre: "Administrateur général mais accès refusé à un site SharePoint"
    symptome: "Le rôle d'administrateur général ou SharePoint ne donne pas accès au contenu d'un site : il faut s'ajouter comme administrateur de la collection de sites."
