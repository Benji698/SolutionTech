domaine: microsoft-365
sous_domaine: applications-office
recense_le: 2026-10-29
# Périmètre : Microsoft 365 Apps (Word, Excel, PowerPoint, Access, Visio, Project, OneNote) sur Windows et Mac.
# Installation et mises à jour Click-to-Run, activation et licences, plantages, compléments, fichiers,
# sécurité des documents, co-édition, problèmes propres à chaque application.
problemes:

  # ───────────────────────── Activation et licences ─────────────────────────

  - id: office-produit-sans-licence
    titre: "Office affiche « Produit sans licence » ou refuse de s'activer"
    symptome: "Barre rouge « Produit sans licence » dans Word, Excel ou Outlook ; les applications passent en lecture seule."
    erreurs: ["Unlicensed Product", "Produit sans licence", "Account Notice: There are problems with your account."]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-US/office/troubleshoot/activation/license-issue-when-start-office-application
    etat: redigee

  - id: office-autre-compte-organisation-deja-connecte
    titre: "« Un autre compte de votre organisation est déjà connecté sur cet ordinateur »"
    symptome: "À la connexion dans Office, un message indique qu'un autre compte du même tenant est déjà connecté ; impossible d'activer avec le bon compte."
    erreurs: ["Sorry, another account from your organization is already signed in on this computer."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoft-365-apps/activation/another-account-already-signed-in
      - https://techcommunity.microsoft.com/discussions/microsoft365apps/sorry-another-account-from-your-organization-is-already-signed-in-on-this-comput/3794453
    etat: redigee

  - id: office-licence-introuvable-application
    titre: "« Office ne trouve pas votre licence pour cette application »"
    symptome: "Au lancement d'une application Office, message de licence introuvable alors que l'abonnement est actif."
    erreurs: ["Microsoft Office can't find your license for this application. A repair attempt was unsuccessful or was cancelled."]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-US/office/troubleshoot/activation/license-issue-when-start-office-application
      - https://learn.microsoft.com/en-us/answers/a/11476127
    etat: redigee

  - id: office-impossible-verifier-licence
    titre: "« Microsoft Office ne peut pas vérifier la licence de ce produit »"
    symptome: "Message au démarrage d'une application Office ; souvent lié au service Protection logicielle (sppsvc) ou au mode de compatibilité."
    erreurs: ["Microsoft Office cannot verify the license for this product. You should repair the Office program by using Control Panel."]
    priorite: rare
    format: express
    sources:
      - https://support.microsoft.com/kb/2797062
    etat: a-rediger

  - id: office-activation-0x8004fc12
    titre: "Erreur d'activation Office 0x8004FC12"
    symptome: "L'activation échoue avec le code 0x8004FC12, souvent après une mise à niveau de Windows."
    erreurs: ["0x8004FC12"]
