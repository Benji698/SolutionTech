    format: express
    sources:
      - https://support.microsoft.com/topic/f32c97d5-11f7-4e56-925c-94959b222bd3
    etat: a-rediger

  - id: office-activation-0x80070005
    titre: "Erreur d'activation Office 0x80070005 (accès refusé)"
    symptome: "L'activation échoue avec 0x80070005 ; problème de droits, parfois apparu après une mise à jour Windows."
    erreurs: ["0x80070005"]
    priorite: rare
    format: express
    sources:
      - https://support.microsoft.com/en-us/office/office-error-code-0x80070005-when-activating-office-7aa7600f-df57-4aef-81d2-25509c66f865
    etat: a-rediger

  - id: office-activation-kms-0xc004f074
    titre: "Office en volume (KMS) ne s'active pas : 0xC004F074"
    symptome: "Office LTSC ou 2019/2021 en licence en volume reste non activé ; le service de licences ne joint pas le serveur KMS."
    erreurs: ["0xC004F074", "The Software Licensing Service reported that the computer could not be activated. No Key Management Service (KMS) could be contacted."]
