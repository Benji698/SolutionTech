domaine: microsoft-365
sous_domaine: entra-id
recense_le: 2026-10-29
# Périmètre : connexions et codes AADSTS (hors MFA / accès conditionnel, traités dans mfa-acces-conditionnel),
# comptes, SSPR et réécriture du mot de passe, invités B2B, rôles et PIM, appareils (jonction, PRT),
# applications d'entreprise et SSO, groupes, Entra Connect côté cloud, Windows Hello for Business, UPN et domaines.
problemes:
  # ---------------------------------------------------------------------------
  # Connexion : comptes, mots de passe, sessions et jetons
  # ---------------------------------------------------------------------------
  - id: m365-connexion-refusee-aadsts
    titre: "Connexion à Microsoft 365 refusée (codes d'erreur AADSTS)"
    symptome: "L'utilisateur ne peut pas se connecter et un code AADSTS s'affiche (mot de passe, compte verrouillé ou désactivé, accès conditionnel)."
    erreurs: ["AADSTS50126", "AADSTS50053", "AADSTS50057", "AADSTS53003", "AADSTS53000"]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
      - https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/app-integration/error-code-aadsts50057-user-account-is-disabled
    etat: redigee
  - id: entra-aadsts50034-compte-inexistant-annuaire
    titre: "Le compte n'existe pas dans l'annuaire (AADSTS50034)"
    symptome: "La connexion échoue avec un message indiquant que le compte n'existe pas dans le locataire : faute de frappe dans l'UPN, compte non synchronisé ou supprimé."
    erreurs: ["AADSTS50034: The user account {identifier} does not exist in the {tenant} directory. To sign into this application, the account must be added to the directory."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
      - https://learn.microsoft.com/en-us/entra/identity/devices/troubleshoot-primary-refresh-token
    etat: a-rediger
  - id: entra-aadsts50055-mot-de-passe-expire
    titre: "Mot de passe expiré à la connexion Microsoft 365 (AADSTS50055)"
    symptome: "L'utilisateur est invité à changer son mot de passe ou la connexion d'une application échoue car le mot de passe cloud a expiré."
    erreurs: ["AADSTS50055: The password is expired."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
      - https://login.microsoftonline.com/error?code=50055
    etat: a-rediger
  - id: entra-aadsts50144-mot-de-passe-ad-expire
    titre: "Mot de passe Active Directory expiré pour un compte synchronisé (AADSTS50144)"
    symptome: "Un utilisateur hybride (PTA, fédération ou PHS avec expiration activée) ne peut plus se connecter au cloud car son mot de passe AD a expiré."
    erreurs: ["AADSTS50144: InvalidPasswordExpiredOnPremPassword - User's Active Directory password has expired."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50056-mot-de-passe-absent-annuaire
    titre: "Aucun mot de passe enregistré pour l'utilisateur dans Entra ID (AADSTS50056)"
    symptome: "La connexion échoue car aucun mot de passe n'existe côté cloud pour ce compte (hachage non synchronisé, compte créé sans mot de passe)."
    erreurs: ["AADSTS50056: Invalid or null password: password doesn't exist in the directory for this user."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50132-session-revoquee-changement-mot-de-passe
    titre: "Session invalidée après un changement de mot de passe (AADSTS50132 / AADSTS50133)"
    symptome: "Après une réinitialisation ou un changement de mot de passe, Outlook, Teams ou le navigateur redemandent la connexion ou échouent en boucle."
    erreurs: ["AADSTS50132: SsoArtifactInvalidOrExpired", "AADSTS50133: SsoArtifactRevoked - The session isn't valid due to password expiration or recent password change."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50173-jeton-revoque
    titre: "Jeton d'actualisation révoqué, nouvelle connexion exigée (AADSTS50173)"
    symptome: "Une application ou un connecteur cesse de fonctionner et demande de se reconnecter, après un changement de mot de passe ou une révocation des sessions par l'administrateur."
    erreurs: ["AADSTS50173: The provided grant has expired due to it being revoked, a fresh auth token is needed."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/app-integration/error-code-aadsts50173-grant-expired-revoked
    etat: a-rediger
  - id: entra-aadsts700082-jeton-expire-inactivite
    titre: "Jeton d'actualisation expiré après une longue inactivité (AADSTS700082 / AADSTS70008)"
    symptome: "Une application, un script ou un compte de service non utilisé depuis longtemps échoue avec un jeton expiré pour inactivité."
    erreurs: ["AADSTS700082: The refresh token has expired due to inactivity.", "AADSTS70008: The refresh token has expired due to inactivity."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts70043-frequence-connexion-jeton-invalide
    titre: "Jeton expiré par la fréquence de connexion de l'accès conditionnel (AADSTS70043)"
    symptome: "Les utilisateurs doivent se reconnecter régulièrement ; les journaux montrent un jeton invalidé par la stratégie de fréquence de connexion."
    erreurs: ["AADSTS70043: The refresh token has expired or is invalid due to sign-in frequency checks by Conditional Access."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50089-flow-token-expire
    titre: "Page de connexion restée ouverte trop longtemps (AADSTS50089)"
    symptome: "L'utilisateur valide sa connexion après avoir laissé la page ouverte longtemps et obtient une erreur de jeton de flux expiré."
    erreurs: ["AADSTS50089: Authentication failed due to flow token expired."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50140-interruption-rester-connecte
    titre: "Échec « Rester connecté ? » dans les journaux de connexion (AADSTS50140)"
    symptome: "Les journaux de connexion affichent des échecs AADSTS50140 alors que l'utilisateur s'est bien connecté : c'est l'écran « Rester connecté ? » (KMSI)."
    erreurs: ["AADSTS50140: KmsiInterrupt - This error occurred due to \"Keep me signed in\" interrupt when the user was signing-in."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50199-confirmation-utilisateur-requise
    titre: "Demande de confirmation « Essayez-vous de vous connecter à… » (AADSTS50199)"
    symptome: "Un écran de confirmation de sécurité s'affiche lors d'une connexion depuis une application ou un navigateur intégré ; l'échec apparaît dans les journaux."
    erreurs: ["AADSTS50199: CmsiInterrupt - For security reasons, user confirmation is required for this request."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50135-changement-mot-de-passe-risque
    titre: "Changement de mot de passe imposé à cause d'un risque sur le compte (AADSTS50135)"
    symptome: "Identity Protection détecte un risque (fuite d'identifiants, connexion suspecte) et oblige l'utilisateur à changer son mot de passe ou bloque la connexion."
    erreurs: ["AADSTS50135: PasswordChangeCompromisedPassword - Password change is required due to account risk.", "AADSTS53011: User blocked due to risk on home tenant."]
    priorite: critique
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50128-domaine-locataire-introuvable
    titre: "Nom de domaine ou locataire introuvable à la connexion (AADSTS50128 / AADSTS90002)"
    symptome: "L'utilisateur saisit une adresse dont le domaine n'est rattaché à aucun locataire (faute de frappe, ancien domaine supprimé, locataire sans abonnement)."
    erreurs: ["AADSTS50128: Invalid domain name - No tenant-identifying information found in either the request or implied by any provided credentials.", "AADSTS90002: Tenant '{tenant}' not found."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50058-session-sso-absente
    titre: "Connexion silencieuse impossible, aucune session ouverte (AADSTS50058)"
    symptome: "Une application tente une connexion unique silencieuse sans session active ; échec visible dans les journaux ou boucle de connexion dans le navigateur (cookies tiers bloqués)."
    erreurs: ["AADSTS50058: UserInformationNotProvided - Session information isn't sufficient for single-sign-on."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
      - https://login.microsoftonline.com/error?code=50058
    etat: a-rediger
  - id: entra-aadsts50196-boucle-detectee
    titre: "Boucle de connexion détectée par Entra ID (AADSTS50196)"
    symptome: "Une application redemande des jetons en boucle ; Entra ID interrompt la connexion avec une erreur de boucle client."
    erreurs: ["AADSTS50196: LoopDetected - A client loop has been detected."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts500021-restrictions-locataire
    titre: "Accès à un autre locataire bloqué par les restrictions de locataire (AADSTS500021 / AADSTS500022)"
    symptome: "Depuis le réseau de l'entreprise, la connexion à un locataire externe (client, partenaire, compte perso pro) est refusée par le proxy ou la stratégie Tenant Restrictions."
    erreurs: ["AADSTS500021: Access to '{tenant}' tenant is denied.", "AADSTS500022: Access to '{tenant}' tenant is denied."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50002-acces-proxy-restreint
    titre: "Connexion refusée à cause d'un accès proxy restreint sur le locataire (AADSTS50002)"
    symptome: "La connexion échoue avec NotAllowedTenant ; une restriction de locataire ou de proxy empêche l'accès."
    erreurs: ["AADSTS50002: NotAllowedTenant - Sign-in failed because of a restricted proxy access on the tenant."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts5000224-locataire-bloque-fraude
    titre: "Locataire bloqué par Microsoft pour suspicion de fraude (AADSTS5000224)"
    symptome: "Plus personne ne peut se connecter au locataire : Microsoft l'a suspendu (fraude, abus, impayé suspect)."
    erreurs: ["AADSTS5000224: We are sorry, this resource is not available. If you are seeing this message by mistake, please contact Microsoft support."]
    priorite: critique
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-erreurs-transitoires-service-connexion
    titre: "Erreur temporaire du service de connexion Microsoft (AADSTS50000, 90033, 90006, 50033, 90024)"
    symptome: "Des connexions échouent ponctuellement avec une erreur côté service ; il faut vérifier l'état du service avant de chercher une cause locale."
    erreurs: ["AADSTS50000: There was an error issuing a token or an issue with our sign-in service.", "AADSTS90033: MsodsServiceUnavailable", "AADSTS90006: ExternalServerRetryableError", "AADSTS50033: RetryableError", "AADSTS90024: RequestBudgetExceededError"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/app-integration/error-code-aadsts50000-issuing-token-sign-in-service
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts90055-limitation-requetes
    titre: "Trop de requêtes de connexion, locataire limité (AADSTS90055)"
    symptome: "Un script ou une application envoie trop de demandes d'authentification et le locataire est temporairement limité."
    erreurs: ["AADSTS90055: TenantThrottlingError - There are too many incoming requests."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts50127-application-broker-requise
    titre: "Application broker requise sur mobile : Authenticator ou Portail d'entreprise (AADSTS50127)"
    symptome: "Sur smartphone, une application professionnelle refuse l'accès tant que Microsoft Authenticator ou le Portail d'entreprise n'est pas installé."
    erreurs: ["AADSTS50127: BrokerAppNotInstalled - User needs to install a broker app to gain access to this content."]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-aadsts70019-code-appareil-expire
    titre: "Connexion par code d'appareil expirée ou code incorrect (AADSTS70019 / AADSTS70018)"
    symptome: "Sur une salle Teams, une TV, Azure CLI ou PowerShell, la connexion via microsoft.com/devicelogin échoue : code expiré ou mal saisi."
    erreurs: ["AADSTS70019: CodeExpired - Verification code expired.", "AADSTS70018: BadVerificationCode - Invalid verification code due to User typing in wrong user code for device code flow."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-changement-mot-de-passe-refuse-aadsts1200xx
    titre: "Changement de mot de passe refusé à la connexion (AADSTS120002, 120003, 120018…)"
    symptome: "L'utilisateur doit changer son mot de passe mais le nouveau est refusé : trop faible, contient son nom, figure dans la liste des mots de passe interdits, ou mot de passe actuel incorrect."
    erreurs: ["AADSTS120000: PasswordChangeIncorrectCurrentPassword", "AADSTS120002: PasswordChangeInvalidNewPasswordWeak", "AADSTS120003: PasswordChangeInvalidNewPasswordContainsMemberName", "AADSTS120018: PasswordChangePasswordDoesnotComplyFuzzyPolicy"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
      - https://learn.microsoft.com/en-us/entra/identity/authentication/troubleshoot-sspr
    etat: a-rediger
  - id: entra-changement-mot-de-passe-hybride-echoue-aadsts1200xx
    titre: "Changement de mot de passe d'un compte synchronisé impossible depuis le cloud (AADSTS120004, 120012, 120013, 120014)"
    symptome: "Le changement de mot de passe d'un utilisateur hybride échoue : complexité AD non respectée, réécriture absente, contrôleur injoignable ou compte AD verrouillé/désactivé."
    erreurs: ["AADSTS120004: PasswordChangeOnPremComplexity", "AADSTS120012: PasswordChangeNeedsToHappenOnPrem", "AADSTS120013: PasswordChangeOnPremisesConnectivityFailure", "AADSTS120014: PasswordChangeOnPremUserAccountLockedOutOrDisabled", "AADSTS120005: PasswordChangeOnPremSuccessCloudFail"]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
      - https://learn.microsoft.com/en-us/entra/identity/authentication/troubleshoot-sspr-writeback
    etat: a-rediger
  # ---------------------------------------------------------------------------
  # Authentification directe (PTA) et authentification unique transparente (Seamless SSO)
  # ---------------------------------------------------------------------------
  - id: entra-pta-aucun-agent-disponible
    titre: "Authentification directe : aucun agent d'authentification disponible (AADSTS80001)"
    symptome: "Tous les utilisateurs synchronisés en authentification directe (PTA) ne peuvent plus se connecter : agents arrêtés, serveurs éteints ou injoignables."
    erreurs: ["AADSTS80001: OnPremiseStoreIsNotAvailable - The Authentication Agent is unable to connect to Active Directory."]
    priorite: critique
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-pass-through-authentication
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-pta-delai-validation-ad-depasse
    titre: "Authentification directe : délai dépassé ou erreur en joignant Active Directory (AADSTS80002 / AADSTS80007)"
    symptome: "Les connexions PTA échouent ou sont lentes : l'agent n'arrive pas à joindre un contrôleur de domaine à temps."
    erreurs: ["AADSTS80002: OnPremisePasswordValidatorRequestTimedout - Password validation request timed out.", "AADSTS80007: OnPremisePasswordValidatorErrorOccurredOnPrem - The Authentication Agent is unable to validate user's password."]
    priorite: critique
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-pass-through-authentication
    etat: a-rediger
  - id: entra-pta-agent-dechiffrement-mot-de-passe
    titre: "Authentification directe : l'agent ne peut pas déchiffrer le mot de passe (AADSTS80010 / 80011)"
    symptome: "Un agent PTA renvoie des erreurs de déchiffrement ; il faut le réinstaller et le réenregistrer."
    erreurs: ["AADSTS80010: OnPremisePasswordValidationEncryptionException - The Authentication Agent is unable to decrypt password.", "80011: Authentication Agent unable to retrieve decryption key."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-pass-through-authentication
    etat: a-rediger
  - id: entra-pta-heures-connexion-ad
    titre: "Connexion cloud refusée hors des horaires autorisés dans AD (AADSTS80012)"
    symptome: "Avec l'authentification directe, l'utilisateur ne peut pas se connecter à Microsoft 365 en dehors des heures d'ouverture de session définies sur son compte AD."
    erreurs: ["AADSTS80012: OnPremisePasswordValidationAccountLogonInvalidHours - The users attempted to log on outside of the allowed hours."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-pta-decalage-horaire-agent
    titre: "Authentification directe : décalage horaire entre l'agent et AD (AADSTS80013)"
    symptome: "Les validations de mot de passe échouent car l'horloge du serveur de l'agent PTA est décalée par rapport aux contrôleurs de domaine."
    erreurs: ["AADSTS80013: OnPremisePasswordValidationTimeSkew"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  - id: entra-pta-enregistrement-agent-echoue
    titre: "Installation ou enregistrement de l'agent d'authentification directe en échec"
    symptome: "L'agent PTA refuse de s'enregistrer : ports sortants bloqués (80, 443), proxy, jeton ou compte administrateur non autorisé."
    erreurs: ["Registration of the Authentication Agent failed", "An unexpected error occurred"]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-pass-through-authentication
    etat: a-rediger
  - id: entra-seamless-sso-ne-fonctionne-pas
    titre: "L'authentification unique transparente (Seamless SSO) ne fonctionne pas : le mot de passe est redemandé"
    symptome: "Sur un poste joint au domaine, l'utilisateur doit saisir son mot de passe Microsoft 365 alors que le SSO transparent est activé (zone intranet, GPO, ticket Kerberos, compte AZUREADSSOACC)."
    erreurs: ["AADSTS81004: DesktopSsoIdentityInTicketIsNotAuthenticated - Kerberos authentication attempt failed.", "AADSTS81009: Unable to validate user's Kerberos ticket."]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-sso
    etat: a-rediger
  - id: entra-seamless-sso-ticket-kerberos-trop-grand
    titre: "Seamless SSO en échec car le ticket Kerberos est trop grand (81001)"
    symptome: "Un utilisateur membre de très nombreux groupes AD n'obtient jamais le SSO transparent alors que ses collègues l'ont."
    erreurs: ["81001: User's Kerberos ticket is too large."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-sso
    etat: a-rediger
  - id: entra-seamless-sso-utilisateur-introuvable-ticket
    titre: "Seamless SSO : utilisateur introuvable ou différent de celui connecté au poste (AADSTS81011 / AADSTS81012)"
    symptome: "Le SSO transparent échoue car le compte du ticket Kerberos n'est pas synchronisé, ou l'utilisateur tente de se connecter avec un autre compte que celui de la session Windows."
    erreurs: ["AADSTS81011: DesktopSsoLookupUserBySidFailed", "AADSTS81012: DesktopSsoMismatchBetweenTokenUpnAndChosenUpn"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-sso
    etat: a-rediger
  - id: entra-seamless-sso-ticket-expire-cle-azureadssoacc
    titre: "Seamless SSO : ticket Kerberos expiré ou clé du compte AZUREADSSOACC non renouvelée (AADSTS81010)"
    symptome: "Le SSO transparent cesse de fonctionner pour tous ; la clé de déchiffrement Kerberos du compte ordinateur AZUREADSSOACC doit être renouvelée."
    erreurs: ["AADSTS81010: DesktopSsoAuthTokenInvalid - Seamless SSO failed because the user's Kerberos ticket has expired or is invalid."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-sso
    etat: a-rediger
  - id: entra-aadsts50180-authentification-windows-integree-requise
    titre: "Authentification Windows intégrée requise mais Seamless SSO non activé (AADSTS50180 / AADSTS81007)"
    symptome: "Une connexion qui attend l'authentification Windows intégrée échoue car le locataire n'est pas activé pour le SSO transparent."
    erreurs: ["AADSTS50180: WindowsIntegratedAuthMissing - Integrated Windows authentication is needed. Enable the tenant for Seamless SSO.", "AADSTS81007: DesktopSsoTenantIsNotOptIn"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    etat: a-rediger
  # ---------------------------------------------------------------------------
  # Applications d'entreprise, SSO SAML / OIDC et consentement
  # ---------------------------------------------------------------------------
  - id: entra-aadsts50105-utilisateur-non-affecte-application
    titre: "L'utilisateur n'est pas affecté à l'application (AADSTS50105)"
    symptome: "L'application est configurée avec « Affectation requise » et l'utilisateur (ou son groupe) n'y est pas affecté : accès refusé après authentification."
    erreurs: ["AADSTS50105: The signed in user '{EmailHidden}' is not assigned to a role for the application '{appId}'({appName})."]
