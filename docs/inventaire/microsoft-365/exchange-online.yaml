    titre: "NDR 550 5.4.1 Recipient address rejected: Access denied (blocage DBEB)"
    symptome: "Les messages entrants vers une adresse du domaine sont rejetés à la périphérie car l'adresse n'existe pas dans l'annuaire Exchange Online (souvent en hybride ou après création récente)."
    erreurs: ["550 5.4.1 Recipient address rejected: Access denied. AS(201806281)"]
