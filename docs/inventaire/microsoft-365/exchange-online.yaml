domaine: microsoft-365
sous_domaine: exchange-online
recense_le: 2026-10-29
# Périmètre : Exchange Online côté service/serveur (flux de messagerie, NDR, boîtes, groupes,
# calendriers et ressources, conformité, migration, authentification du domaine).
# Les problèmes du client Outlook sont recensés dans un autre fichier.
problemes:
  # ---------- Codes de non-remise (NDR) : 5.1.x ----------
  - id: exchange-ndr-550-5-1-1-adresse-destinataire-invalide
    titre: "Message refusé : adresse du destinataire introuvable (550 5.1.1)"
    symptome: "L'expéditeur reçoit un rapport de non-remise indiquant que l'adresse de destination n'existe pas ou est mal saisie."
    erreurs: ["550 5.1.1 Bad destination mailbox address", "550 5.1.1 RESOLVER.ADR.RecipNotFound; not found"]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-code-550-5-1-1-through-5-1-20-in-exchange-online
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/non-delivery-reports-in-exchange-online
    etat: a-rediger
  - id: exchange-ndr-550-5-1-1-exrecipnotfound-adresse-x500
    titre: "NDR 550 5.1.1 RESOLVER.ADR.ExRecipNotFound vers un collègue (ancienne adresse X500 en cache)"
    symptome: "Un message interne revient en erreur alors que le destinataire existe, souvent après une migration ou une recréation de boîte : la saisie semi-automatique pointe vers un ancien objet."
    erreurs: ["550 5.1.1 RESOLVER.ADR.ExRecipNotFound; not found"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/exrecipnotfound-ndr
    etat: a-rediger
  - id: exchange-ndr-imceaex-destinataire-interne
    titre: "NDR IMCEAEX en envoyant à un utilisateur interne (LegacyExchangeDN manquant)"
    symptome: "Le rapport de non-remise contient une adresse commençant par IMCEAEX- : l'entrée de cache Outlook pointe vers un LegacyExchangeDN qui n'existe plus."
    erreurs: ["IMCEAEX-_O=", "550 5.1.1 RESOLVER.ADR.ExRecipNotFound"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/imceaex-ndr
    etat: a-rediger
  - id: exchange-ndr-550-5-1-0-sender-denied
    titre: "NDR 550 5.1.0 Sender denied (réponse à un message enregistré hors ligne)"
    symptome: "Une réponse envoyée depuis un message enregistré en fichier (.msg) puis rouvert est refusée : l'adresse de l'expéditeur d'origine n'est plus résolue."
    erreurs: ["550 5.1.0 Sender denied"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-code-550-5-1-0-in-exchange-online
    etat: a-rediger
  - id: exchange-ndr-550-5-1-8-expediteur-bloque-spam
    titre: "Utilisateur bloqué en envoi pour spam sortant (550 5.1.8 bad outbound sender)"
    symptome: "Un utilisateur ne peut plus envoyer aucun message ; l'alerte « Utilisateur restreint » apparaît dans Microsoft Defender. Le compte est souvent compromis."
    erreurs: ["550 5.1.8 Access denied, bad outbound sender"]
    priorite: critique
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-code-550-5-1-8
    etat: a-rediger
  - id: exchange-ndr-550-5-1-10-recipient-not-found
    titre: "NDR 550 5.1.10 RESOLVER.ADR.RecipientNotFound (destinataire introuvable)"
    symptome: "Le destinataire n'est pas trouvé par recherche d'adresse SMTP : faute de frappe, adresse supprimée ou rétrodiffusion (backscatter) d'un spam usurpant l'expéditeur."
    erreurs: ["550 5.1.10 RESOLVER.ADR.RecipientNotFound; Recipient not found by SMTP address lookup"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-code-550-5-1-10-in-exchange-online
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/recipientnotfound-ndr
    etat: a-rediger
  - id: exchange-ndr-550-5-1-11-delegue-mise-a-jour-reunion-hybride
    titre: "NDR 550 5.1.11 quand un délégué met à jour une réunion après la migration du responsable"
    symptome: "En environnement hybride, le délégué qui modifie une réunion du responsable migré vers Microsoft 365 reçoit un rapport de non-remise."
    erreurs: ["550 5.1.11"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/calendars/550-5111-ndr-delegate-sends-update-meeting
    etat: a-rediger
  - id: exchange-ndr-550-5-1-20-plusieurs-adresses-from
    titre: "NDR 550 5.1.20 : plusieurs adresses From sans en-tête Sender"
    symptome: "Les messages générés par une application qui place plusieurs adresses dans le champ De sont rejetés par Exchange Online."
    erreurs: ["550 5.1.20 Multiple From addresses are not allowed without Sender address"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-code-550-5-1-20-multiple-from-addresses
      - https://mc.merill.net/message/MC886603
    etat: a-rediger
  - id: exchange-ndr-550-5-1-90-limite-quotidienne-destinataires
    titre: "Limite quotidienne de destinataires atteinte (550 5.1.90)"
    symptome: "Un utilisateur ou une boîte partagée qui envoie en masse ne peut plus envoyer : la limite de 10 000 destinataires par 24 h glissantes est dépassée."
    erreurs: ["550 5.1.90 Your message can't be sent because you've reached your daily limit for message recipients"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/non-delivery-reports-in-exchange-online
      - https://techcommunity.microsoft.com/discussions/exchange_general/550-5-1-90-ndr/2631003
    etat: a-rediger
  - id: exchange-ndr-quota-soumission-depasse
    titre: "« The message can't be submitted because the sender's submission quota was exceeded »"
    symptome: "L'envoi est refusé après un grand nombre de destinataires dans la journée ; peut révéler un compte compromis envoyant du spam."
    erreurs: ["The message can't be submitted because the sender's submission quota was exceeded", "554 5.2.0 STOREDRV.Submission.Exception:SubmissionQuotaExceededException"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-for-submission-quota-exceeded-in-exchange-online
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/send-emails/smtp-submission-improvements
    etat: a-rediger
  # ---------- NDR : 5.2.x ----------
  - id: exchange-boite-pleine
    titre: "Boîte aux lettres pleine : avertissements puis NDR 554 5.2.2 mailbox full"
    symptome: "Les expéditeurs reçoivent un rapport de non-remise car la boîte (ou le dossier Éléments récupérables) du destinataire a atteint son quota."
    erreurs: ["554 5.2.2 mailbox full; STOREDRV.Deliver.Exception:QuotaExceededException"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/non-delivery-reports-in-exchange-online
    etat: redigee
  - id: exchange-ndr-554-5-2-2-dossier-public-messagerie-plein
    titre: "NDR 554 5.2.2 mailbox full en écrivant à un dossier public à extension messagerie"
    symptome: "Les messages destinés à un dossier public à extension messagerie sont rejetés car la boîte de dossiers publics qui l'héberge a atteint son quota."
    erreurs: ["554 5.2.2 mailbox full"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/cannot-send-mail-mepf
    etat: a-rediger
  - id: exchange-ndr-groupe-m365-aggregategroupmailbox-plein
    titre: "NDR « AggregateGroupMailbox » plein en écrivant à un groupe Microsoft 365"
    symptome: "Les messages envoyés à un groupe Microsoft 365 reviennent en erreur car la boîte du groupe a atteint son quota."
    erreurs: ["AggregateGroupMailbox", "554 5.2.2 mailbox full"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/ndr-received-send-emails-microsoft365-groups
    etat: a-rediger
  - id: exchange-ndr-550-5-2-0-badprimary
    titre: "NDR 550 5.2.0 RESOLVER.ADR.BadPrimary (adresse principale invalide)"
    symptome: "Le message vers un destinataire est refusé car son adresse SMTP principale est incorrecte ou incohérente avec ses adresses proxy."
    erreurs: ["550 5.2.0 RESOLVER.ADR.BadPrimary"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/badprimary-ndr
    etat: a-rediger
  - id: exchange-ndr-554-5-2-0-storedrv-deliver-exception
    titre: "NDR 554 5.2.0 STOREDRV.Deliver.Exception (MapiExceptionNotFound)"
    symptome: "La remise échoue au moment du dépôt dans la boîte du destinataire, souvent à cause d'une règle de boîte ou d'un dossier cible introuvable."
    erreurs: ["554 5.2.0 STOREDRV.Deliver.Exception:ObjectNotFoundException; Failed to process message due to a permanent exception with message", "MapiExceptionNotFound"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/mapiexceptionnotfound-ndr
    etat: a-rediger
  - id: exchange-ndr-554-5-2-0-sendasdenied
    titre: "Envoi refusé « SendAsDeniedException » depuis une boîte partagée ou une application (554 5.2.0)"
    symptome: "Un utilisateur ou une application SMTP envoie avec une adresse De qui n'est pas la sienne sans disposer du droit Envoyer en tant que."
    erreurs: ["554 5.2.0 STOREDRV.Submission.Exception:SendAsDeniedException; Failed to process message due to a permanent exception", "554 5.2.252 SendAsDeniedException.MapiExceptionSendAsDenied"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/mailflow/cannot-send-email-with-full-access
      - https://learn.microsoft.com/en-us/answers/questions/892221/unable-to-send-emails-from-shared-mailbox
    etat: a-rediger
  - id: exchange-ndr-5-2-121-5-2-122-limite-reception-horaire
    titre: "NDR 5.2.121 / 5.2.122 : limite horaire de réception du destinataire dépassée"
    symptome: "Une application ou un expéditeur envoie trop de messages par heure à la même boîte Exchange Online, qui refuse les messages excédentaires."
    erreurs: ["5.2.121 Recipient's per hour message receive limit from specific sender exceeded", "5.2.122 Recipient's per hour message receive limit exceeded"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/non-delivery-reports-in-exchange-online
    etat: a-rediger
  - id: exchange-ndr-554-4-3-2-mailbox-busy-limite-elements-dossier
    titre: "NDR 554 4.3.2 mailbox busy : trop d'éléments dans un dossier de la boîte"
    symptome: "Les messages ne sont plus remis à une boîte dont un dossier (souvent la Boîte de réception ou un dossier alimenté par une règle) a atteint la limite d'éléments."
    erreurs: ["554 4.3.2 mailbox busy; STOREDRV.Deliver.Exception:StoragePermanentException.MapiExceptionMaxObjsExceeded"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/remote-server-returned-mailbox-busy
    etat: a-rediger
  - id: exchange-ndr-432-4-3-2-recipient-thread-limit
    titre: "Remise différée 432 4.3.2 recipient thread limit exceeded (boîte qui reçoit trop vite)"
    symptome: "Une boîte qui reçoit un afflux massif de messages voit sa remise ralentie par limitation (throttling) ; les messages arrivent en retard."
    erreurs: ["432 4.3.2 STOREDRV.Deliver; recipient thread limit exceeded"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/non-delivery-reports-in-exchange-online
    etat: a-rediger
  # ---------- NDR : 5.3.x / 5.4.x / 4.4.x ----------
  - id: exchange-ndr-5-3-190-journalisation-onprem-non-supportee
    titre: "NDR 5.3.190 : journalisation de messages locaux vers Microsoft 365 non prise en charge"
    symptome: "Les rapports de journal envoyés par un serveur local vers une boîte Exchange Online sont rejetés."
