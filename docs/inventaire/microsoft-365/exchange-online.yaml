    titre: "Boucle de messagerie : 554 5.4.14 Hop count exceeded (connecteurs, domaine non vérifié)"
    symptome: "Les messages tournent entre Exchange Online et un autre serveur jusqu'au rejet ; fréquent en hybride (connecteur ou domaine accepté mal configuré)."
    erreurs: ["554 5.4.14 Hop count exceeded - possible mail loop ATTR34", "5.4.6 Routing loop detected"]
    priorite: critique
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/email-delivery/ndr/fix-error-code-5-4-6-through-5-4-20-in-exchange-online
      - https://learn.microsoft.com/en-us/troubleshoot/exchange/administration/hop-count-exceeded-ndr
    etat: a-rediger
  - id: exchange-ndr-4-4-7-message-expire
    titre: "Message expiré après 24 h de tentatives (4.4.7 / 550 4.4.7 Message expired)"
    symptome: "Exchange Online n'a pas réussi à remettre le message au serveur distant pendant le délai de nouvelle tentative ; l'expéditeur reçoit d'abord un avis de retard puis un NDR."
    erreurs: ["550 4.4.7 QUEUE.Expired; message expired", "4.4.7 Message expired"]
