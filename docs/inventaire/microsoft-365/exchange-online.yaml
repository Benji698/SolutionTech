    titre: "Échec de résolution DNS du destinataire ou du smart host : 450 4.4.312 / 550 5.4.312 DNS query failed"
    symptome: "Les messages vers un domaine externe restent en file puis expirent car la requête DNS (MX ou smart host du connecteur) échoue."
