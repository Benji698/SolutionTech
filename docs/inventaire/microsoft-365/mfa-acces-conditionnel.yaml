    titre: "Code MFA par SMS ou appel vocal jamais reçu"
    symptome: "L'utilisateur choisit SMS ou appel mais ne reçoit rien : mauvais numéro ou indicatif, filtrage des expéditeurs inconnus, opérateur, pays bloqué."
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/mfa/text-voice-call-verification-code-mfa-not-send
      - https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/mfa/troubleshoot-azure-mfa-issue
