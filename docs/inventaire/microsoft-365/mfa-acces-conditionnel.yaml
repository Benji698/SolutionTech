  - id: mfa-authenticator-sauvegarde-restauration-incomplete
    titre: "Authenticator : la restauration depuis la sauvegarde cloud ne récupère pas les comptes professionnels"
    symptome: "Après restauration sur un nouveau téléphone, les comptes professionnels apparaissent mais demandent une nouvelle vérification, ou seuls certains comptes sont restaurés."
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/answers/questions/5576417/microsoft-authenticator-cloud-backup-only-restore
      - https://learn.microsoft.com/en-au/answers/questions/1118863/accounts-not-showing-up-in-microsoft-authenticator
    etat: a-rediger
  - id: mfa-authenticator-sauvegarde-introuvable-autre-compte
    titre: "Authenticator : « your backup is not stored with this email » lors de la restauration"
    symptome: "La récupération échoue car le compte Microsoft personnel ou Apple ID utilisé n'est pas celui de la sauvegarde."
    erreurs: ["your backup is not stored with this email"]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/answers/questions/1206671/backup-restore-failed-on-new-phone-your-backup-is
      - https://learn.microsoft.com/en-us/answers/questions/955233/microsoft-authenticator-unable-to-recover-your-bac
    etat: a-rediger
  - id: mfa-authenticator-limite-cinq-appareils
    titre: "Impossible d'ajouter Authenticator : limite de 5 appareils atteinte"
    symptome: "L'enregistrement d'une nouvelle application d'authentification échoue car le compte a déjà cinq applications ou jetons enregistrés."
    erreurs: ["You cannot have more than 5 hardware tokens or authenticator apps.", "You have too many devices registered."]
    priorite: rare
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/mfa/cant-set-up-mfa-five-devices-registered
