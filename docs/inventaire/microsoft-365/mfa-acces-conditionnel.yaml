  - id: mfa-echec-500121-authentification-forte
    titre: "Erreur 500121 : échec pendant la demande d'authentification forte"
    symptome: "La connexion échoue après l'étape MFA : demande refusée, expirée, mauvais code ou inscription Authenticator invalide."
    erreurs: ["AADSTS500121: Authentication failed during strong authentication request."]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/answers/questions/1190353/mfa-issue-for-a-user-error-500121
      - https://admindroid.com/error-code-500121-auth-failed-during-strong-auth-request
    etat: a-rediger
  # --- SMS et appel ---
