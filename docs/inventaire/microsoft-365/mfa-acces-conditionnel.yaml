    titre: "Nouveau téléphone ou téléphone perdu : l'utilisateur ne peut plus valider la MFA"
    symptome: "L'utilisateur a changé, perdu ou réinitialisé son téléphone et ne peut plus répondre à la double authentification."
    erreurs: ["AADSTS50076"]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/mfa/troubleshoot-azure-mfa-issue
    etat: redigee
  - id: mfa-authenticator-notification-absente
    titre: "Microsoft Authenticator : la notification d'approbation n'arrive pas"
    symptome: "La page de connexion attend une approbation mais aucune notification n'apparaît sur le téléphone (mode Ne pas déranger, optimisation de batterie Android, notifications désactivées, inscription push corrompue)."
    erreurs: []
    priorite: frequent
    format: complete
    sources:
      - https://support.microsoft.com/account-billing/troubleshoot-problems-with-microsoft-authenticator-a3a74493-566b-4c2e-b949-a2789bac0fd3
