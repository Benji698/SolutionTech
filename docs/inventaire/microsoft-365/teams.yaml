    symptome: "La connexion échoue faute d'accès réseau aux points de terminaison Microsoft (proxy, pare-feu, délai dépassé), souvent sur RDS ou réseau instable."
    erreurs: ["0xCAA82EE2", "0xCAA82EE7"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoftteams/teams-sign-in/resolve-sign-in-errors
      - https://www.technipages.com/fix-microsoft-teams-error-caa82ee2
    etat: a-rediger

  - id: teams-erreur-connexion-caa20004-acces-conditionnel
    titre: "Connexion à Teams refusée, erreur 0xCAA20004 (accès conditionnel)"
    symptome: "L'utilisateur ne peut pas se connecter au client Teams ; une stratégie d'accès conditionnel Entra ID bloque la connexion."
    erreurs: ["0xCAA20004"]
    priorite: frequent
    format: express
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoftteams/teams-sign-in/resolve-sign-in-errors
