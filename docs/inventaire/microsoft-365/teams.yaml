    titre: "Teams ne se lance plus, reste bloqué ou se comporte bizarrement (cache)"
    symptome: "Écran blanc, chargement en boucle, messages récents absents ; vider le cache ou réinitialiser l'application corrige le plus souvent."
    erreurs: ["We're sorry—we've run into an issue."]
    priorite: frequent
    format: complete
    sources:
      - https://learn.microsoft.com/en-us/troubleshoot/microsoftteams/teams-administration/clear-teams-cache
