# Taxonomie de SOS Admin : domaines → sous-domaines → thèmes (optionnels).
# L'ordre d'affichage est alphabétique (calculé au build) : l'ordre ici n'a pas d'importance.
# Règle : une fiche a UN emplacement principal (domaine + sous_domaine) et peut apparaître
# ailleurs par renvoi (champ apparait_aussi_dans), jamais par copie.
# Identifiants : kebab-case sans accents, stables (ils servent dans les URL).

