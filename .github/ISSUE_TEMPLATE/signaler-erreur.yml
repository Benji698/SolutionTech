name: Signaler une erreur dans une fiche
description: Une commande fausse, une étape qui ne marche plus, une information datée…
title: "[Erreur] "
labels: [contenu, erreur]
body:
  - type: input
    id: fiche
    attributes:
      label: Identifiant de la fiche
      description: Il apparaît dans l'adresse de la fiche, après /fiches/
      placeholder: ad-compte-verrouille
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Qu'est-ce qui ne va pas ?
      description: Étape concernée, ce qui est écrit, ce qui se passe réellement.
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement testé
      placeholder: Windows 11 24H2, Windows Server 2022…
  - type: textarea
    id: correction
    attributes:
      label: Correction proposée (et source si possible)
  - type: markdown
    attributes:
      value: "⚠️ N'indiquez aucune donnée réelle d'entreprise (noms de serveurs, adresses IP, identifiants)."
